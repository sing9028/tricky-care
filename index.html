<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#01696f">
<meta name="apple-mobile-web-app-title" content="Tricky Care">
<title>Tricky Care — 寵物健康管家</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-error: #a12c7b;
  --color-warning: #964219;
  --color-success: #437a22;
  --color-border: #e5e3dc;
  --color-banner: #fde8e8;
  --color-banner-text: #8b1a1a;
  --sidebar-w: 240px;
  --tab-h: 64px;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius-card: 12px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.08);
  --card-border: 1px solid rgba(0,0,0,.08);
  --font: 'Noto Sans TC', system-ui, sans-serif;
  --banner-warn-bg: #fff3e0;
  --banner-warn-text: #964219;
  --med-low-bg: #fff8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #1a1916;
    --color-surface: #242220;
    --color-primary: #3db8be;
    --color-primary-hover: #5fd4da;
    --color-text: #f0ede6;
    --color-text-muted: #a8a69f;
    --color-border: #3d3a35;
    --color-banner: #3d2020;
    --color-banner-text: #ffb4b4;
    --shadow: 0 2px 12px rgba(0,0,0,.35);
    --shadow-card: 0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-border: #e5e3dc;
  --color-banner: #fde8e8;
  --color-banner-text: #8b1a1a;
  --shadow: 0 2px 12px rgba(40,37,29,.08);
  --shadow-card: 0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"] {
  --color-bg: #1a1916;
  --color-surface: #242220;
  --color-primary: #3db8be;
  --color-primary-hover: #5fd4da;
  --color-text: #f0ede6;
  --color-text-muted: #a8a69f;
  --color-border: #3d3a35;
  --color-banner: #3d2020;
  --color-banner-text: #ffb4b4;
  --shadow: 0 2px 12px rgba(0,0,0,.35);
  --shadow-card: 0 2px 12px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--color-bg);color:var(--color-text);line-height:1.5;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:1rem}
a{color:var(--color-primary)}
#app{display:flex;min-height:100dvh}
.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--color-surface);border-right:1px solid var(--color-border);flex-direction:column;padding:1.25rem 0;z-index:100}
.sidebar-brand{padding:0 1.25rem 1.5rem;font-weight:700;font-size:1.125rem;color:var(--color-primary)}
.sidebar-nav{display:flex;flex-direction:column;gap:.25rem;flex:1;padding:0 .75rem}
.nav-btn{display:flex;align-items:center;gap:.75rem;min-height:44px;padding:.625rem 1rem;border:none;background:transparent;color:var(--color-text-muted);border-radius:var(--radius);cursor:pointer;width:100%;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav-btn:hover,.nav-btn.active{background:rgba(1,105,111,.12);color:var(--color-primary)}
.nav-btn .icon,.tab-btn .icon{display:flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem}
.nav-btn .icon svg,.tab-btn .icon svg{width:22px;height:22px}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid var(--color-border)}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:.5rem}
.theme-toggle label{font-size:.875rem;color:var(--color-text-muted)}
.tab-bar{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--color-surface);border-top:1px solid var(--color-border);z-index:100;padding:0 .25rem env(safe-area-inset-bottom,0)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;min-width:44px;border:none;background:transparent;color:var(--color-text-muted);cursor:pointer;font-size:.625rem;font-weight:500;padding:.25rem}
.tab-btn.active{color:var(--color-primary)}
.main{flex:1;width:100%;padding:1rem 1rem calc(var(--tab-h) + 1rem);max-width:900px}
@media(min-width:768px){
  .sidebar{display:flex}
  .tab-bar{display:none}
  .main{margin-left:var(--sidebar-w);padding:1.5rem 2rem 2rem;max-width:none}
}
.view{display:none}
.view.active{display:block}
.view-header{margin-bottom:1.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.view-header-main{flex:1;min-width:0}
.view-header h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem}
.view-header p{color:var(--color-text-muted);font-size:.875rem}
.notify-wrap{position:relative;flex-shrink:0}
.notify-btn{position:relative;width:44px;height:44px;min-width:44px;min-height:44px;border:none;background:transparent;border-radius:var(--radius);cursor:pointer;color:var(--color-primary);display:flex;align-items:center;justify-content:center}
.notify-btn:hover{background:rgba(1,105,111,.1)}
.notify-btn svg{width:22px;height:22px}
.notify-badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:var(--color-error);color:#fff;font-size:.6875rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.notify-dropdown{position:absolute;right:0;top:48px;width:min(320px,82vw);background:var(--color-surface);border:var(--card-border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.16);padding:.75rem;z-index:180;display:none}
.notify-dropdown.open{display:block}
.notify-dropdown h4{font-size:.875rem;margin-bottom:.5rem}
.notify-list{list-style:none;max-height:300px;overflow:auto}
.notify-item{width:100%;text-align:left;border:none;background:transparent;padding:.6rem .55rem;border-radius:8px;cursor:pointer;color:var(--color-text)}
.notify-item:hover{background:rgba(1,105,111,.08)}
.notify-item .meta{display:block;font-size:.75rem;color:var(--color-text-muted);margin-top:.15rem}
.notify-section{font-size:.75rem;font-weight:600;color:var(--color-text-muted);margin:.5rem 0 .25rem;padding:0 .55rem}
.notify-section:first-child{margin-top:0}
.batch-tag{display:inline-block;font-size:.75rem;padding:.15rem .5rem;border-radius:6px;margin-right:.35rem;vertical-align:middle}
.batch-tag-expired{background:#fde8e8;color:#8b1a1a}
.batch-tag-soon{background:#fff3e0;color:#964219}
.batch-tag-muted{background:rgba(0,0,0,.06);color:var(--color-text-muted)}
.batch-tag-ok{background:rgba(67,122,34,.12);color:var(--color-success)}
.batch-list li{margin-bottom:.35rem}
.card{background:var(--color-surface);border-radius:var(--radius);padding:1rem 1.25rem;box-shadow:var(--shadow);margin-bottom:1rem;border:var(--card-border)}
.greeting{font-size:1.25rem;font-weight:700}
.date-line{color:var(--color-text-muted);font-size:.875rem;margin-top:.25rem}
.banner-warn{background:#fff3e0;color:#964219;border-radius:var(--radius);padding:.875rem 1rem;margin-bottom:1rem;border:1px solid rgba(150,66,25,.2)}
.banner-warn strong{display:block;margin-bottom:.5rem}
.banner-warn-links{display:flex;flex-wrap:wrap;gap:.5rem}
.banner-warn-links button{background:transparent;border:none;color:#964219;font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px;padding:.25rem .5rem;font-size:.9375rem}
.med-item.med-low{background:#fff8f0;border-left:4px solid #964219;padding-left:.75rem;margin-left:-.25rem;border-radius:0 var(--radius) var(--radius) 0}
.progress-ring{display:flex;align-items:center;gap:1rem}
.progress-bar{flex:1;height:10px;background:var(--color-border);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--color-success);border-radius:5px;transition:width .3s}
.progress-text{font-weight:700;font-size:1.125rem;color:var(--color-primary);white-space:nowrap}
.dashboard-summary{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1rem}
@media(min-width:768px){.dashboard-summary{grid-template-columns:repeat(2,1fr)}}
.summary-card{background:var(--color-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1rem 1.25rem;border:var(--card-border)}
.summary-card h3{font-size:.9375rem;font-weight:700;margin-bottom:.75rem}
.summary-value{font-size:1.375rem;font-weight:700;color:var(--color-primary);line-height:1.3}
.summary-meta{font-size:.8125rem;color:var(--color-text-muted);margin-top:.35rem}
.summary-trend{font-size:.8125rem;margin-top:.5rem;color:var(--color-text-muted)}
.summary-bar{height:10px;background:var(--color-border);border-radius:5px;overflow:hidden;margin-top:.75rem}
.summary-bar-fill{height:100%;background:var(--color-success);border-radius:5px;min-width:0;transition:width .3s}
.summary-empty{font-size:.875rem;color:var(--color-text-muted);text-align:center;padding:1.25rem .5rem;line-height:1.5}
.summary-empty .emoji{display:block;font-size:1.5rem;margin-bottom:.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;min-width:44px;padding:.625rem 1.25rem;border:none;border-radius:var(--radius);font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-secondary{background:transparent;color:var(--color-primary);border:2px solid var(--color-primary)}
.btn-secondary:hover{background:rgba(1,105,111,.08)}
.btn-danger{background:var(--color-error);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-confirm{background:var(--color-primary);color:#fff}
.btn-confirm:hover{background:var(--color-primary-hover)}
.btn-cancel{background:transparent;color:var(--color-text-muted);border:1px solid var(--color-border)}
.btn-cancel:hover{background:rgba(0,0,0,.04)}
.btn-ghost{background:transparent;color:var(--color-text-muted);border:1px solid var(--color-border)}
.btn-ghost:hover{background:var(--color-border)}
.btn-success{background:var(--color-success);color:#fff}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:.5rem .875rem;font-size:.875rem}
.badge{display:inline-flex;align-items:center;padding:.2rem .5rem;border-radius:6px;font-size:.75rem;font-weight:500}
.badge-type{background:var(--color-border);color:var(--color-text-muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:.5rem;border:none;background:transparent;border-radius:var(--radius);cursor:pointer;color:var(--color-text-muted);transition:background .15s,color .15s}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.icon-btn.icon-restock:hover{background:rgba(67,122,34,.15);color:var(--color-success)}
.icon-btn.icon-del:hover{background:rgba(161,44,123,.12);color:var(--color-error)}
.icon-btn svg{width:22px;height:22px}
.dose-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.dose-row input[type=number]{flex:1;min-width:80px}
.dose-quick{display:flex;flex-wrap:wrap;gap:.35rem}
.dose-quick button{min-width:44px;min-height:44px;padding:0 .5rem;border:1px solid var(--color-border);background:var(--color-surface);border-radius:8px;cursor:pointer;font-size:1rem;font-weight:500;color:var(--color-primary)}
.dose-quick button:hover{background:rgba(1,105,111,.1)}
.med-logs-toggle{width:100%;margin-top:.75rem;min-height:44px}
.med-logs-panel{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--color-border)}
.log-tabs{display:flex;gap:.5rem;margin-bottom:.75rem}
.log-tab{min-height:44px;padding:.5rem 1rem;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius);cursor:pointer;font-size:.875rem}
.log-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.log-history{font-size:.8125rem;color:var(--color-text-muted);list-style:none}
.log-history li{padding:.35rem 0;border-bottom:1px solid var(--color-border)}
.theme-switch-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;width:100%;min-height:44px;padding:.625rem .5rem;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);cursor:pointer;color:var(--color-primary)}
.theme-switch-btn svg{width:22px;height:22px}
.theme-switch-label{font-size:.75rem;font-weight:500;color:var(--color-text-muted);line-height:1.2}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.modal-header h2{margin-bottom:0;flex:1}
.daily-section{margin-top:1rem}
.daily-section h3{font-size:1rem;margin-bottom:.75rem}
.walk-list{margin:.75rem 0 0;padding:0;list-style:none}
.walk-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--color-border)}
.walk-row:last-child{border-bottom:none}
.walk-row-info{flex:1;font-size:.875rem}
.walk-row-info strong{display:block;margin-bottom:.2rem}
.btn-walk-del{flex-shrink:0;min-width:44px;min-height:44px;border:none;background:transparent;color:var(--color-error);cursor:pointer;font-size:1.125rem;border-radius:var(--radius)}
.btn-walk-del:hover{background:rgba(161,44,123,.1)}
.duration-quick{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.duration-quick button{min-width:44px;min-height:44px;padding:0 .65rem;border:1px solid var(--color-border);background:var(--color-surface);border-radius:8px;cursor:pointer;font-size:.875rem;font-weight:500;color:var(--color-primary)}
.duration-quick button:hover{background:rgba(1,105,111,.1)}
.meals-section{margin-top:0}
.meals-header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.meals-header h3{margin-bottom:0}
.meal-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.875rem 0;border-bottom:1px solid var(--color-border)}
.meal-row:last-child{border-bottom:none}
.meal-row-info{flex:1}
.meal-row-info strong{display:block;margin-bottom:.25rem}
.meal-row-info p{font-size:.875rem;color:var(--color-text-muted)}
.food-section-title{font-size:1rem;font-weight:700;margin-bottom:.75rem}
.food-result{margin-top:.25rem}
.food-result-warn .summary-value{color:var(--color-warning)}
.food-plan-error{font-size:.8125rem;color:var(--color-error);margin-top:.5rem;display:none}
.food-plan-error.visible{display:block}
.exercise-stat{font-size:.9375rem;font-weight:500;margin-bottom:1rem;padding:.75rem 1rem;background:rgba(1,105,111,.08);border-radius:var(--radius-card);border:var(--card-border)}
.timeline{list-style:none;margin:0;padding:0}
.timeline-item{position:relative;padding-left:1.25rem;margin-bottom:1rem}
.timeline-item::before{content:'';position:absolute;left:4px;top:.5rem;bottom:-1rem;width:2px;background:var(--color-border)}
.timeline-item:last-child::before{display:none}
.timeline-item::after{content:'';position:absolute;left:0;top:.65rem;width:10px;height:10px;border-radius:50%;background:var(--color-primary)}
.timeline-card{background:var(--color-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);border:var(--card-border);padding:1rem 1.25rem}
.timeline-card h3{font-size:1rem;margin-bottom:.35rem}
.timeline-card .meta{font-size:.8125rem;color:var(--color-text-muted);margin-bottom:.35rem}
.timeline-card p{font-size:.875rem;color:var(--color-text-muted)}
.walk-timer-display{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-primary);margin:.5rem 0}
.poop-btns{display:flex;gap:.75rem;flex-wrap:wrap}
.poop-btn{min-width:44px;min-height:44px;padding:.5rem 1rem;border:2px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius);cursor:pointer;font-size:.875rem;font-weight:500}
.poop-btn.active{border-color:var(--color-primary);background:rgba(1,105,111,.1);color:var(--color-primary)}
.poop-detail-fields{margin-top:.25rem}
.poop-detail-fields.hidden{display:none}
.poop-list{margin:.75rem 0 0;padding:0;list-style:none}
.poop-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--color-border)}
.poop-row:last-child{border-bottom:none}
.poop-row-info{flex:1;font-size:.875rem}
.poop-row-info strong{display:block;margin-bottom:.2rem}
.weight-calc-panel{margin-top:1rem;padding:1rem;background:rgba(1,105,111,.06);border-radius:var(--radius);border:1px solid var(--color-border)}
.weight-calc-result{font-weight:700;color:var(--color-primary);margin-top:.5rem}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--color-text-muted)}
.empty .emoji{font-size:2rem;display:block;margin-bottom:.5rem}
.med-list{list-style:none}
.med-item{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;padding:1rem 0;border-bottom:1px solid var(--color-border)}
.med-item:last-child{border-bottom:none}
.med-item.highlight{animation:highlight 2s ease}
@keyframes highlight{0%,100%{background:transparent}50%{background:rgba(1,105,111,.15)}}
.med-info{flex:1;min-width:140px}
.med-name{font-weight:700}
.med-meta{font-size:.8125rem;color:var(--color-text-muted)}
.med-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.fab-page{position:fixed;bottom:88px;right:24px;z-index:50;width:56px;height:56px;border-radius:50%;background:#01696f;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(1,105,111,.3);display:none;align-items:center;justify-content:center;padding:0}
.fab-page.visible{display:flex}
.fab-page .fab-plus{color:#fff;font-size:1.75rem;line-height:1;font-weight:300;pointer-events:none}
@media(min-width:768px){.fab-page{bottom:32px;right:32px}}
.slot-group{margin-bottom:1.5rem}
.slot-title{font-weight:700;font-size:1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.slot-complete{width:100%;margin-bottom:1rem;font-size:1rem}
.schedule-item{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--color-border);gap:1rem}
.schedule-item:last-child{border-bottom:none}
.toggle-wrap{display:flex;align-items:center;gap:.75rem;min-height:44px}
.toggle{position:relative;width:52px;height:32px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--color-border);border-radius:16px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;height:26px;width:26px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--color-success)}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}
.toggle input:disabled+.toggle-slider{opacity:.5;cursor:not-allowed}
.date-nav{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.date-nav input[type=date]{min-height:44px;padding:.5rem;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);color:var(--color-text)}
.readonly-badge{font-size:.75rem;color:var(--color-warning);font-weight:500}
.undo-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1rem;background:rgba(67,122,34,.15);border-radius:var(--radius);margin-bottom:1rem}
.chart-wrap{width:100%;margin:1rem 0}
.chart-wrap canvas{display:block;width:100%;height:200px}
.tabs-inner{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.tab-inner{min-height:44px;padding:.5rem 1rem;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius);cursor:pointer;font-weight:500;color:var(--color-text-muted)}
.tab-inner.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.log-list{list-style:none}
.log-item{padding:1rem 0;border-bottom:1px solid var(--color-border)}
.log-item:last-child{border-bottom:none}
.log-item h3{font-size:1rem;font-weight:700}
.log-item .meta{font-size:.8125rem;color:var(--color-text-muted);margin:.25rem 0}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:500;margin-bottom:.35rem;font-size:.875rem}
.form-group input,.form-group select,.form-group textarea{width:100%;min-height:44px;padding:.625rem .75rem;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);color:var(--color-text)}
.form-group textarea{min-height:88px;resize:vertical}
.form-hint{font-size:.75rem;color:var(--color-text-muted);margin-top:.25rem}
.form-row{display:grid;gap:1rem}
@media(min-width:480px){.form-row{grid-template-columns:1fr 1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--color-surface);border-radius:var(--radius);padding:1.5rem;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.15);border:var(--card-border)}
.modal h2{font-size:1.25rem}
.modal-actions{display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap}
.modal-actions .btn{flex:1}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--color-text);color:var(--color-bg);padding:.75rem 1.25rem;border-radius:var(--radius);z-index:300;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
.export-grid{display:grid;gap:1rem}
@media(min-width:480px){.export-grid{grid-template-columns:1fr 1fr}}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

<body>
<div id="app">
<aside class="sidebar" aria-label="主選單">
  <div class="sidebar-brand">🐾 Tricky Care</div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <button type="button" class="theme-switch-btn" id="theme-toggle-btn" aria-label="切換顯示模式"><i data-lucide="sun"></i><span class="theme-switch-label">淺色</span></button>
  </div>
</aside>
<nav class="tab-bar" id="tab-bar" aria-label="底部選單"></nav>
<main class="main" id="main-content">
  <section class="view active" id="view-dashboard" data-view="dashboard"></section>
  <section class="view" id="view-stock" data-view="stock"></section>
  <section class="view" id="view-schedule" data-view="schedule"></section>

<button type="button" class="fab-page" id="fab-backup" data-fab-view="backup" aria-label="新增"><span class="fab-plus">＋</span></button>
<script>
(function(){
'use strict';
const STORAGE_KEY='trickyHealthData';
const KEY_STOCK_LOGS='tricky-stock-logs';
const KEY_DOSE_LOGS='tricky-dose-logs';
const KEY_DAILY_NOTES='tricky-daily-notes';
const KEY_FEED_TEMPLATE='tricky-feed-template';
const KEY_FOOD_INVENTORY='tricky-food-inventory';
const KEY_FOOD_DAILY_PLAN='tricky-food-daily-plan';
const KEY_OWNER_WEIGHT='tricky-owner-weight';
const FOOD_FRESH_PACK_G=150;
const FOOD_CAN_G=420;
const DEFAULT_FOOD_INVENTORY={freshPacks:0,cans:0,milkGrams:0};
const DEFAULT_FOOD_DAILY_PLAN={freshGrams:0,canGrams:0,milkGrams:0};
const DEFAULT_FEED_TEMPLATE=[
  {name:'第1餐',note:'35g 鮮食 + 35g 罐頭'},
  {name:'第2餐',note:'45g 鮮食 + 45g 罐頭'},
  {name:'第3餐',note:'35g 鮮食 + 40g 罐頭'},
  {name:'第4餐',note:'35g 鮮食 + 40g 罐頭'}
];
const WALK_QUICK_MINS=[15,30,45,60];
const KEY_THEME_MODE='tricky-theme-mode';
const THEME_CYCLE=['light','dark','system'];
const THEME_UI={light:{icon:'sun',label:'淺色'},dark:{icon:'moon',label:'深色'},system:{icon:'monitor',label:'跟隨系統'}};
let themeMediaQuery=null;
const NAV=[
  {id:'dashboard',icon:'layout-dashboard',label:'首頁'},
  {id:'stock',icon:'pill',label:'庫存'},
  {id:'schedule',icon:'calendar-days',label:'日程'},
  {id:'health',icon:'heart-pulse',label:'健康'},
  {id:'backup',icon:'hard-drive',label:'備份'}
];
const SLOT_LABELS={morning:'早上',noon:'中午',evening:'晚上'};
const ABNORMAL_TYPES=['嘔吐','腹瀉','食慾不振','抽搐','其他'];
const DOSE_FRACS=[{v:0.25,l:'¼'},{v:0.333,l:'⅓'},{v:0.5,l:'½'},{v:1,l:'1'},{v:2,l:'2'}];
const POOP_SOFTNESS_LABELS={1:'1 - 非常硬（粒狀）',2:'2 - 硬',3:'3 - 正常',4:'4 - 軟',5:'5 - 非常軟（水狀）'};
let state=loadState();
migrateAllMedBatches();
let currentView='dashboard';
let scheduleDate=todayStr();
let scheduleUnlocked={};
let healthTab='weight';
let undoTimer=null;
let highlightMedId=null;
let expandedMedLogs={};
let medLogTab={};
let walkTimerInterval=null;
let walkTimerStart=null;
let notifyOutsideHandler=null;

function defaultState(){
  return{theme:'auto',medications:[],schedules:{},completions:{},weightLogs:[],abnormalLogs:[],medicalLogs:[]};
}
function loadState(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r)return{...defaultState(),...JSON.parse(r)};
  }catch(e){}
  return defaultState();
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function getStockLogs(){try{const r=localStorage.getItem(KEY_STOCK_LOGS);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveStockLogs(a){localStorage.setItem(KEY_STOCK_LOGS,JSON.stringify(a));}
function getDoseLogs(){try{const r=localStorage.getItem(KEY_DOSE_LOGS);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveDoseLogs(a){localStorage.setItem(KEY_DOSE_LOGS,JSON.stringify(a));}
function getDailyNotes(){try{const r=localStorage.getItem(KEY_DAILY_NOTES);return r?JSON.parse(r):{};}catch(e){return{};}}
function saveDailyNotes(o){localStorage.setItem(KEY_DAILY_NOTES,JSON.stringify(o));}
function getOwnerWeight(){return localStorage.getItem(KEY_OWNER_WEIGHT)||'';}
function setOwnerWeight(v){if(v)localStorage.setItem(KEY_OWNER_WEIGHT,String(v));else localStorage.removeItem(KEY_OWNER_WEIGHT);}
function initExtraKeys(){
  if(!localStorage.getItem(KEY_STOCK_LOGS))saveStockLogs([]);
  if(!localStorage.getItem(KEY_DOSE_LOGS))saveDoseLogs([]);
  if(!localStorage.getItem(KEY_DAILY_NOTES))saveDailyNotes({});
  if(!localStorage.getItem(KEY_FEED_TEMPLATE))saveFeedTemplate(JSON.parse(JSON.stringify(DEFAULT_FEED_TEMPLATE)));
  if(!localStorage.getItem(KEY_FOOD_INVENTORY))saveFoodInventory(JSON.parse(JSON.stringify(DEFAULT_FOOD_INVENTORY)));
  if(!localStorage.getItem(KEY_FOOD_DAILY_PLAN))saveFoodDailyPlan(JSON.parse(JSON.stringify(DEFAULT_FOOD_DAILY_PLAN)));
}
function getFoodInventory(){
  try{
    const r=localStorage.getItem(KEY_FOOD_INVENTORY);
    if(r){
      const p=JSON.parse(r);
      return{
        freshPacks:Math.max(0,parseInt(p.freshPacks,10)||0),
        cans:Math.max(0,parseInt(p.cans,10)||0),
        milkGrams:Math.max(0,parseFloat(p.milkGrams)||0)
      };
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_FOOD_INVENTORY));
}
function saveFoodInventory(inv){localStorage.setItem(KEY_FOOD_INVENTORY,JSON.stringify(inv));}
function getFoodDailyPlan(){
  try{
    const r=localStorage.getItem(KEY_FOOD_DAILY_PLAN);
    if(r){
      const p=JSON.parse(r);
      return{
        freshGrams:Math.max(0,parseFloat(p.freshGrams)||0),
        canGrams:Math.max(0,parseFloat(p.canGrams)||0),
        milkGrams:Math.max(0,parseFloat(p.milkGrams)||0)
      };
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_FOOD_DAILY_PLAN));
}
function saveFoodDailyPlan(plan){localStorage.setItem(KEY_FOOD_DAILY_PLAN,JSON.stringify(plan));}
function getFeedTemplate(){
  try{
    const r=localStorage.getItem(KEY_FEED_TEMPLATE);
    if(r){const p=JSON.parse(r);if(Array.isArray(p)&&p.length)return p;}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_FEED_TEMPLATE));
}
function saveFeedTemplate(t){localStorage.setItem(KEY_FEED_TEMPLATE,JSON.stringify(t));}
function mutateDailyDay(date){
  const all=getDailyNotes();
  if(!all[date])all[date]={walks:[],poops:[]};
  return{all,day:all[date]};
}
function isoToHM(isoOrTs){
  const d=new Date(isoOrTs);
  if(isNaN(d.getTime()))return nowTimeStr();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function normalizeWalk(w){
  if(!w||typeof w!=='object')return{id:Date.now(),startTime:nowTimeStr(),durationMinutes:0,note:''};
  let st=w.startTime;
  if(st&&String(st).indexOf('T')>=0)st=isoToHM(st);
  else if(!st||!/^\d{1,2}:\d{2}$/.test(String(st)))st=nowTimeStr();
  return{
    id:w.id!=null?w.id:Date.now(),
    startTime:st,
    durationMinutes:Number(w.durationMinutes)||0,
    note:w.note!=null?String(w.note):''
  };
}
function walkMinutesFromWalk(w){return Number(normalizeWalk(w).durationMinutes)||0;}
function getWalkTotalMinutesFromWalks(walks){
  return(walks||[]).reduce((s,w)=>s+walkMinutesFromWalk(w),0);
}
function ensureMealsForDate(date){
  const{all,day}=mutateDailyDay(date);
  if(!Array.isArray(day.meals)||!day.meals.length){
    day.meals=JSON.parse(JSON.stringify(getFeedTemplate()));
    all[date]=day;
    saveDailyNotes(all);
  }
  return day.meals;
}
function getPast7WalkTotal(){
  let t=0;
  getLast7DateStrings().forEach(d=>{t+=getWalkTotalMinutesFromWalks(readDailyNoteDay(d).walks);});
  return t;
}
function getAllWalkTimeline(){
  const all=getDailyNotes();
  const entries=[];
  Object.keys(all).forEach(date=>{
    (all[date].walks||[]).forEach((w,idx)=>{
      entries.push({date,idx,walk:normalizeWalk(w)});
    });
  });
  entries.sort((a,b)=>{
    const ka=a.date+' '+a.walk.startTime;
    const kb=b.date+' '+b.walk.startTime;
    return kb.localeCompare(ka);
  });
  return entries;
}
const DOSE_EPS=0.005;
function parseDoseValue(val){
  const v=parseFloat(val);
  return isNaN(v)?0:v;
}
function formatDose(n){
  const v=parseFloat(n);
  if(isNaN(v))return String(n==null?'':n);
  if(Math.abs(v-0.25)<DOSE_EPS)return'¼';
  if(Math.abs(v-0.333)<DOSE_EPS||Math.abs(v-1/3)<DOSE_EPS)return'⅓';
  if(Math.abs(v-0.5)<DOSE_EPS)return'½';
  const s=v.toFixed(2);
  return s.replace(/\.?0+$/,'')||'0';
}
function doseQuickHtml(inputName){
  return'<div class="dose-quick">'+DOSE_FRACS.map(f=>'<button type="button" class="dose-pick" data-target="'+inputName+'" data-val="'+f.v+'">'+f.l+'</button>').join('')+'</div>';
}
function plainNumberFieldHtml(label,name,value,required,minVal){
  const req=required?' required':'';
  const min=minVal!=null?' min="'+minVal+'"':' min="0"';
  const val=value!=null&&value!==''?' value="'+value+'"':'';
  return'<div class="form-group"><label>'+label+'</label><input type="number" name="'+name+'"'+req+min+' step="0.001"'+val+'></div>';
}
function dosePerTimeFieldHtml(label,name,value,required){
  const req=required?' required':'';
  const val=value!=null&&value!==''?' value="'+value+'"':'';
  return'<div class="form-group"><label>'+label+'</label><div class="dose-row"><input type="number" name="'+name+'"'+req+' min="0.01" step="0.001"'+val+'>'+doseQuickHtml(name)+'</div></div>';
}
function bindDoseQuick(root){
  (root||document).querySelectorAll('.dose-pick').forEach(btn=>{
    btn.onclick=()=>{
      const scope=root||document;
      const inp=scope.querySelector('[name="'+btn.dataset.target+'"]')||scope.querySelector('[data-dose-input="'+btn.dataset.target+'"]');
      if(inp){inp.value=btn.dataset.val;inp.dispatchEvent(new Event('input',{bubbles:true}));}
    };
  });
}
function calcMedStock(med){
  if(!Array.isArray(med.batches)||!med.batches.length)return parseDoseValue(med.stock);
  return med.batches.reduce((s,b)=>s+parseDoseValue(b.qty),0);
}
function syncMedStock(med){med.stock=Math.max(0,calcMedStock(med));}
function ensureMedBatches(med){
  if(!Array.isArray(med.batches)||!med.batches.length){
    med.batches=[{id:Date.now(),qty:parseFloat(med.stock)||0,expiry:null,addedDate:null}];
    syncMedStock(med);
    return true;
  }
  med.batches.forEach((b,i)=>{
    if(b.id==null)b.id=Date.now()+i;
    b.qty=parseDoseValue(b.qty);
    if(b.expiry==='')b.expiry=null;
  });
  syncMedStock(med);
  return false;
}
function getInitialBatch(med){
  ensureMedBatches(med);
  if(!med.batches.length)return null;
  let initial=med.batches[0];
  med.batches.forEach(b=>{
    if(b.addedDate&&(!initial.addedDate||b.addedDate<initial.addedDate))initial=b;
  });
  return initial;
}
function migrateAllMedBatches(){
  let changed=false;
  state.medications.forEach(m=>{if(ensureMedBatches(m))changed=true;});
  if(changed)saveState();
}
function compareBatchesFEFO(a,b){
  if(!a.expiry&&!b.expiry)return 0;
  if(!a.expiry)return 1;
  if(!b.expiry)return -1;
  return a.expiry.localeCompare(b.expiry);
}
function sortBatchesFEFO(batches){return[...batches].sort(compareBatchesFEFO);}
function daysUntilExpiry(expiry){
  if(!expiry)return null;
  const today=parseDate(todayStr());
  const exp=parseDate(expiry);
  return Math.round((exp-today)/86400000);
}
function renderExpiryTag(expiry){
  if(!expiry)return'<span class="batch-tag batch-tag-muted">未設定到期日</span>';
  const days=daysUntilExpiry(expiry);
  if(days<0)return'<span class="batch-tag batch-tag-expired">🛑 已過期</span>';
  if(days<=30)return'<span class="batch-tag batch-tag-soon">⏳ 即將到期（'+days+' 日後）</span>';
  return'<span class="batch-tag batch-tag-ok">到期 '+esc(expiry)+'</span>';
}
function deductMedStock(med,dose){
  ensureMedBatches(med);
  let remaining=parseDoseValue(dose);
  if(remaining<=DOSE_EPS)return[];
  const sorted=sortBatchesFEFO(med.batches);
  const deductions=[];
  sorted.forEach(batch=>{
    if(remaining<=DOSE_EPS)return;
    const take=Math.min(batch.qty,remaining);
    if(take<=DOSE_EPS)return;
    batch.qty-=take;
    remaining-=take;
    deductions.push({batchId:batch.id,qty:take,expiry:batch.expiry,addedDate:batch.addedDate});
    if(batch.qty<=DOSE_EPS)med.batches=med.batches.filter(b=>b.id!==batch.id);
  });
  syncMedStock(med);
  return deductions;
}
function restoreMedStockByBatches(med,deductions){
  if(!deductions||!deductions.length)return;
  ensureMedBatches(med);
  deductions.forEach(({batchId,qty,expiry,addedDate})=>{
    const d=parseDoseValue(qty);
    if(d<=DOSE_EPS)return;
    let batch=med.batches.find(b=>b.id===batchId);
    if(batch)batch.qty+=d;
    else med.batches.push({id:batchId,qty:d,expiry:expiry!=null?expiry:null,addedDate:addedDate!=null?addedDate:null});
  });
  syncMedStock(med);
}
function restoreMedStock(med,dose){
  ensureMedBatches(med);
  const d=parseDoseValue(dose);
  if(d<=DOSE_EPS)return;
  if(med.batches.length)med.batches[0].qty+=d;
  else med.batches.push({id:Date.now(),qty:d,expiry:null,addedDate:null});
  syncMedStock(med);
}
function nowTimeStr(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function addStockLog(medId,medName,qty,expiry){
  const logs=getStockLogs();
  logs.unshift({id:Date.now(),medicineId:medId,medicineName:medName,qty,expiry:expiry!=null?expiry:null,date:todayStr(),time:nowTimeStr()});
  saveStockLogs(logs);
}
function addDoseLog(medId,medName,qty,date,session,batchDeductions){
  const logs=getDoseLogs();
  const entry={id:Date.now(),medicineId:medId,medicineName:medName,qty,date,time:nowTimeStr(),session,batchDeductions:batchDeductions||null};
  logs.unshift(entry);
  saveDoseLogs(logs);
  return entry.id;
}
function removeDoseLogsByIds(ids){
  if(!ids||!ids.length)return;
  const set=new Set(ids);
  saveDoseLogs(getDoseLogs().filter(l=>!set.has(l.id)));
}
function removeLatestDoseLog(medId,date){
  const logs=getDoseLogs();
  const idx=logs.findIndex(l=>l.medicineId===medId&&l.date===date);
  if(idx>=0){const log=logs[idx];logs.splice(idx,1);saveDoseLogs(logs);return log;}
  return null;
}
function icons(){if(typeof lucide!=='undefined'&&lucide.createIcons)lucide.createIcons();}
function viewHeaderHtml(title,subtitle){
  return'<div class="view-header"><div class="view-header-main"><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p></div>'+renderNotifyCenterHtml()+'</div>';
}
function renderNotifyCenterHtml(){
  const lows=getLowStockMeds();
  const expiryAlerts=getExpiryAlertMeds();
  const count=lows.length+expiryAlerts.length;
  const badge=count?'<span class="notify-badge">'+count+'</span>':'';
  let list='';
  if(lows.length){
    list+='<p class="notify-section">低庫存</p><ul class="notify-list">'+lows.map(m=>'<li><button type="button" class="notify-item" data-notify-med="'+m.id+'">'+esc(m.name)+'<span class="meta">現有 '+formatDose(m.stock)+' '+esc(m.unit)+' ｜ 警示 ≤ '+formatDose(m.lowStockThreshold)+' '+esc(m.unit)+'</span></button></li>').join('')+'</ul>';
  }
  if(expiryAlerts.length){
    list+='<p class="notify-section">到期警示</p><ul class="notify-list">'+expiryAlerts.map(a=>{
      const label=a.severity===2?'🛑 已過期':'⏳ 即將到期（'+a.worstDays+' 日後）';
      return'<li><button type="button" class="notify-item" data-notify-med="'+a.med.id+'">'+esc(a.med.name)+'<span class="meta">'+label+' · '+esc(a.expiry)+' · '+formatDose(a.qty)+' '+esc(a.med.unit)+'</span></button></li>';
    }).join('')+'</ul>';
  }
  if(!list)list='<p class="form-hint">目前未有庫存或到期通知</p>';
  return'<div class="notify-wrap"><button type="button" class="notify-btn" id="notify-btn" aria-label="通知中心"><i data-lucide="bell"></i>'+badge+'</button><div class="notify-dropdown" id="notify-dropdown"><h4>庫存通知</h4>'+list+'</div></div>';
}
function closeNotifyDropdown(){
  const dd=document.getElementById('notify-dropdown');
  if(dd)dd.classList.remove('open');
}
function bindNotifyCenter(){
  const btn=document.getElementById('notify-btn');
  const dd=document.getElementById('notify-dropdown');
  if(!btn||!dd)return;
  btn.onclick=(e)=>{
    e.stopPropagation();
    dd.classList.toggle('open');
  };
  dd.onclick=(e)=>{
    const item=e.target.closest('[data-notify-med]');
    if(item){
      const medId=item.dataset.notifyMed;
      closeNotifyDropdown();
      switchView('stock',{highlightMed:medId});
    }
  };
  if(notifyOutsideHandler)document.removeEventListener('click',notifyOutsideHandler);
  notifyOutsideHandler=(e)=>{
    if(!dd.classList.contains('open'))return;
    const wrap=e.target.closest('.notify-wrap');
    if(!wrap)closeNotifyDropdown();
  };
  document.addEventListener('click',notifyOutsideHandler);
}
function getFullBackup(){
  return{version:2,state,stockLogs:getStockLogs(),doseLogs:getDoseLogs(),dailyNotes:getDailyNotes(),feedTemplate:getFeedTemplate(),foodInventory:getFoodInventory(),foodDailyPlan:getFoodDailyPlan(),ownerWeight:getOwnerWeight()};
}
function restoreFullBackup(data){
  if(data.version===2||data.state){
    state={...defaultState(),...(data.state||{})};
    saveStockLogs(data.stockLogs||[]);
    saveDoseLogs(data.doseLogs||[]);
    saveDailyNotes(data.dailyNotes||{});
    if(data.feedTemplate)saveFeedTemplate(data.feedTemplate);
    if(data.foodInventory)saveFoodInventory(data.foodInventory);
    if(data.foodDailyPlan)saveFoodDailyPlan(data.foodDailyPlan);
    if(data.ownerWeight!=null)setOwnerWeight(data.ownerWeight);
    migrateAllMedBatches();
  }else{
    state={...defaultState(),...data};
    saveStockLogs([]);
    saveDoseLogs([]);
    saveDailyNotes({});
  }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function isPastDate(s){return s<todayStr();}
function isReadonlyScheduleDate(s){return isPastDate(s)&&!scheduleUnlocked[s];}
function timeToMinutes(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function getSlot(t){
  const mins=timeToMinutes(t);
  if(mins>=360&&mins<720)return'morning';
  if(mins>=720&&mins<1080)return'noon';
  return'evening';
}
function completionKey(medId,time){return medId+'_'+time;}
function getCompletionsForDate(date){
  if(!state.completions[date])state.completions[date]={items:{}};
  return state.completions[date];
}
function getAllScheduleItems(){
  const items=[];
  state.medications.forEach(med=>{
    const slots=state.schedules[med.id]||[];
    slots.forEach(s=>items.push({med,time:s.time,dose:s.dose||med.dosePerTime,slot:getSlot(s.time)}));
  });
  return items;
}
function readCompletionsItems(date){
  const comp=state.completions[date];
  return comp&&comp.items?comp.items:{};
}
function getTodayProgress(){
  const date=todayStr();
  const items=readCompletionsItems(date);
  const schedule=getAllScheduleItems();
  let done=0;
  schedule.forEach(it=>{
    if(items[completionKey(it.med.id,it.time)])done++;
  });
  return{done,total:schedule.length};
}
function getLast7DateStrings(){
  const out=[];
  for(let i=6;i>=0;i--)out.push(addDays(todayStr(),-i));
  return out;
}
function getWeeklyMedSummary(){
  const dates=getLast7DateStrings();
  const perDay=getAllScheduleItems().length;
  if(!perDay)return null;
  let done=0;
  const total=perDay*dates.length;
  dates.forEach(date=>{
    const items=readCompletionsItems(date);
    Object.keys(items).forEach(k=>{if(items[k])done++;});
  });
  const pct=total?Math.min(100,Math.round(done/total*100)):0;
  return{done,total,pct};
}
function getLatestWeightSummary(){
  const logs=(state.weightLogs||[]).filter(w=>w&&w.date&&typeof w.kg==='number'&&!isNaN(w.kg));
  if(!logs.length)return null;
  const sorted=[...logs].sort((a,b)=>{
    const c=b.date.localeCompare(a.date);
    return c!==0?c:String(b.id||'').localeCompare(String(a.id||''));
  });
  const latest=sorted[0];
  let trend='';
  if(sorted.length>=2){
    const prev=sorted[1];
    const diff=latest.kg-prev.kg;
    const absDiff=Math.abs(diff);
    const rounded=Math.round(absDiff*100)/100;
    if(absDiff<0.005)trend='→ 體重持平';
    else if(diff>0)trend='↑ 增加 '+rounded+'kg';
    else trend='↓ 減少 '+rounded+'kg';
  }
  return{kg:latest.kg,date:latest.date,trend};
}
function readDailyNoteDay(date){
  const all=getDailyNotes();
  const d=all[date];
  if(!d||typeof d!=='object')return{walks:[],poops:[]};
  const poops=(Array.isArray(d.poops)?d.poops:[]).map(normalizePoop).filter(Boolean);
  return{walks:Array.isArray(d.walks)?d.walks:[],poops};
}
function normalizePoop(p){
  if(!p||typeof p!=='object')return null;
  if(p.status&&!('hasPoop' in p)){
    if(p.status==='none')return{id:p.id!=null?p.id:Date.now(),hasPoop:false,time:p.time||''};
    const softness=p.status==='soft'?5:3;
    return{id:p.id!=null?p.id:Date.now(),hasPoop:true,count:1,softness,time:p.time||''};
  }
  const hasPoop=!!p.hasPoop;
  return{
    id:p.id!=null?p.id:Date.now(),
    hasPoop,
    count:hasPoop?Math.max(1,parseInt(p.count,10)||1):null,
    softness:hasPoop?Math.min(5,Math.max(1,parseInt(p.softness,10)||3)):null,
    time:p.time||''
  };
}
function formatPoopExportText(p){
  const n=normalizePoop(p);
  if(!n.hasPoop)return'無大便';
  return'有 '+n.count+' 次 · '+(POOP_SOFTNESS_LABELS[n.softness]||n.softness);
}
function getTodayLifeSummary(){
  const day=readDailyNoteDay(todayStr());
  const walkMin=day.walks.reduce((s,w)=>{const m=Number(w&&w.durationMinutes);return s+(isNaN(m)?0:m);},0);
  const lastPoop=day.poops.length?day.poops[day.poops.length-1]:null;
  const hasWalk=walkMin>0;
  const hasPoopRecord=!!lastPoop;
  if(!hasWalk&&!hasPoopRecord)return null;
  return{walkMin,lastPoop:hasPoopRecord?lastPoop:null};
}

function calcFoodSupply(inventory,plan){
  const freshTotal=Math.max(0,parseInt(inventory.freshPacks,10)||0)*FOOD_FRESH_PACK_G;
  const canTotal=Math.max(0,parseInt(inventory.cans,10)||0)*FOOD_CAN_G;
  const milkTotal=Math.max(0,parseFloat(inventory.milkGrams)||0);
  const freshDaily=Math.max(0,parseFloat(plan.freshGrams)||0);
  const canDaily=Math.max(0,parseFloat(plan.canGrams)||0);
  const milkDaily=Math.max(0,parseFloat(plan.milkGrams)||0);
  const totalWeight=freshTotal+canTotal+milkTotal;
  const dailyTotal=freshDaily+canDaily+milkDaily;
  if(dailyTotal<=0)return{valid:false,reason:'plan',totalWeight,dailyTotal,freshTotal,canTotal,milkTotal};
  const daysExact=totalWeight/dailyTotal;
  const days=Math.floor(daysExact);
  const endDate=addDays(todayStr(),days);
  return{valid:true,days,daysExact,endDate,totalWeight,dailyTotal,freshTotal,canTotal,milkTotal};
}

function getLowStockMeds(){return state.medications.filter(m=>{ensureMedBatches(m);return m.stock<=m.lowStockThreshold;});}
function getExpiryAlertMeds(){
  const map=new Map();
  state.medications.forEach(med=>{
    ensureMedBatches(med);
    med.batches.forEach(b=>{
      if(!b.expiry)return;
      const days=daysUntilExpiry(b.expiry);
      if(days>30)return;
      const severity=days<0?2:1;
      const existing=map.get(med.id);
      if(!existing||severity>existing.severity||(severity===existing.severity&&days<existing.worstDays)){
        map.set(med.id,{med,severity,worstDays:days,expiry:b.expiry,qty:b.qty});
      }
    });
  });
  return Array.from(map.values()).sort((a,b)=>a.worstDays-b.worstDays);
}

function renderMedLogsPanel(medId){
  const med=state.medications.find(m=>m.id===medId);
  if(!med)return'';
  ensureMedBatches(med);
  let html='<p style="font-size:.875rem;font-weight:500;margin-bottom:.5rem">批次詳情</p>';
  if(!med.batches.length){
    html+='<p style="font-size:.875rem;color:var(--color-text-muted)">暫無批次</p>';
  }else{
    const sorted=sortBatchesFEFO(med.batches);
    html+='<ul class="log-history batch-list">'+sorted.map(b=>'<li>'+renderExpiryTag(b.expiry)+' · '+formatDose(b.qty)+' '+esc(med.unit)+(b.addedDate?' · 入貨 '+esc(b.addedDate):'')+'</li>').join('')+'</ul>';
  }
  const stockLogs=getStockLogs().filter(l=>l.medicineId===medId).slice(0,5);
  html+='<p style="font-size:.875rem;font-weight:500;margin:1rem 0 .5rem">入貨紀錄</p>';
  if(!stockLogs.length)html+='<p style="font-size:.875rem;color:var(--color-text-muted)">暫無入貨紀錄</p>';

    return'<li>'+l.date+' '+l.time+' · +'+formatDose(l.qty)+' · 到期 '+exp+'</li>';

function openMedForm(id){
  const m=id?state.medications.find(x=>x.id===id):null;
  const initialBatch=m?getInitialBatch(m):null;
  const expiryVal=initialBatch&&initialBatch.expiry?initialBatch.expiry:'';
  const body='<form id="med-form">'+
    '<div class="form-group"><label>名稱 *</label><input name="name" required maxlength="80" value="'+(m?esc(m.name):'')+'"></div>'+
    '<div class="form-row"><div class="form-group"><label>類型 *</label><select name="type" required><option value="drug"'+(m&&m.type==='drug'?' selected':'')+'>藥物</option><option value="supplement"'+(m&&m.type==='supplement'?' selected':'')+'>保健品</option></select></div>'+
    '<div class="form-group"><label>單位 *</label><select name="unit" required><option value="粒"'+(m&&m.unit==='粒'?' selected':'')+'>粒</option><option value="ml"'+(m&&m.unit==='ml'?' selected':'')+'>ml</option><option value="包"'+(m&&m.unit==='包'?' selected':'')+'>包</option></select></div></div>'+
    (id?'<div class="form-group"><label>現有庫存數量</label><input type="number" name="stock" value="'+(m?m.stock:0)+'" step="0.001" readonly tabindex="-1"></div>':
    plainNumberFieldHtml('庫存數量 *','stock',m?m.stock:0,true,0))+
    '<div class="form-group"><label>初始批次到期日</label><input type="date" name="expiry" value="'+expiryVal+'"><p class="form-hint">選填，留空代表未設定</p></div>'+
    dosePerTimeFieldHtml('每次劑量 *','dosePerTime',m?m.dosePerTime:1,true)+
    plainNumberFieldHtml('低庫存警示閾值 *','lowStockThreshold',m?m.lowStockThreshold:5,true,0)+
    '</form>';
  openModal(id?'編輯藥物':'新增藥物',body,
    '<button type="button" class="btn btn-cancel" data-modal-cancel>取消</button><button type="button" class="btn btn-confirm" data-modal-save>儲存</button>');
  bindDoseQuick(document.getElementById('med-form'));
  document.querySelector('[data-modal-cancel]').onclick=closeModal;
  document.querySelector('[data-modal-save]').onclick=()=>{
    const f=document.getElementById('med-form');
    if(!f.reportValidity())return;
    const fd=new FormData(f);
    const data={name:fd.get('name').trim(),type:fd.get('type'),unit:fd.get('unit'),
      dosePerTime:parseDoseValue(fd.get('dosePerTime')),
      lowStockThreshold:parseDoseValue(fd.get('lowStockThreshold'))};
    const stockQty=parseDoseValue(fd.get('stock'));
    const expiryRaw=String(fd.get('expiry')||'').trim();
    const expiry=expiryRaw||null;
    if(!data.name){showToast('請輸入名稱');return;}
    if(id){
      const idx=state.medications.findIndex(x=>x.id===id);
      if(idx>=0){
        const med=state.medications[idx];
        const batch=getInitialBatch(med);
        if(batch)batch.expiry=expiry;
        state.medications[idx]={...med,...data};
      }
    }else{
      const nid=uid();
      state.medications.push({id:nid,...data,stock:stockQty,
        batches:[{id:Date.now(),qty:stockQty,expiry,addedDate:todayStr()}]});
      state.schedules[nid]=state.schedules[nid]||[];
    }
    saveState();closeModal();render();
    showToast(id?'已更新':'已新增');
  };
}

function openRestock(id){
  const m=state.medications.find(x=>x.id===id);
  if(!m)return;
  ensureMedBatches(m);
  openModal('入貨 — '+m.name,
    '<form id="restock-form">'+plainNumberFieldHtml('補充數量 *','qty','',true,0.01)+
    '<div class="form-group"><label>到期日</label><input type="date" name="expiry"><p class="form-hint">選填，留空代表未設定到期日</p></div></form>',
    '<button type="button" class="btn btn-cancel" data-modal-cancel>取消</button><button type="button" class="btn btn-confirm" data-modal-save>確認入貨</button>');
  document.querySelector('[data-modal-cancel]').onclick=closeModal;
  document.querySelector('[data-modal-save]').onclick=()=>{
    const f=document.getElementById('restock-form');
    if(!f.reportValidity())return;
    const fd=new FormData(f);
    const qty=parseDoseValue(fd.get('qty'));
    const expiryRaw=String(fd.get('expiry')||'').trim();
    const expiry=expiryRaw||null;
    m.batches.push({id:Date.now(),qty,expiry,addedDate:todayStr()});
    syncMedStock(m);

function deleteMed(id){
  const m=state.medications.find(x=>x.id===id);
  if(!m)return;
  confirmDialog('刪除藥物','確定要刪除「'+m.name+'」？此操作無法復原。',()=>{
    state.medications=state.medications.filter(x=>x.id!==id);
    delete state.schedules[id];
    Object.keys(state.completions).forEach(d=>{
      Object.keys(state.completions[d].items||{}).forEach(k=>{
        if(k.startsWith(id+'_'))delete state.completions[d].items[k];
      });
    });
    saveState();renderStock();showToast('已刪除');
  });
}

let pendingUndo=null;
function renderSchedule(){
  const el=document.getElementById('view-schedule');
  const date=scheduleDate;
  const readonly=isReadonlyScheduleDate(date);
  const comp=getCompletionsForDate(date);
  const items=getAllScheduleItems();
  const bySlot={morning:[],noon:[],evening:[]};
  items.forEach(it=>bySlot[it.slot].push(it));
  bySlot.morning.sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
  bySlot.noon.sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
  bySlot.evening.sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));

  let undoBar='';
  if(pendingUndo&&pendingUndo.date===date){
    undoBar='<div class="undo-bar"><span>已標記「'+SLOT_LABELS[pendingUndo.slot]+'」完成</span><button type="button" class="btn btn-sm btn-secondary" id="btn-undo">↩ 撤銷</button></div>';
  }

  let slotsHtml='';
  ['morning','noon','evening'].forEach(slot=>{
    const list=bySlot[slot];
    if(!list.length&&!items.length)return;
    const allDone=list.length>0&&list.every(it=>comp.items[completionKey(it.med.id,it.time)]);
    let inner='';
    if(list.length){
      inner=list.map(it=>{
        const key=completionKey(it.med.id,it.time);
        const done=!!comp.items[key];
        const dose=it.dose||it.med.dosePerTime;
        return'<div class="schedule-item"><div><strong>'+esc(it.med.name)+'</strong><br><span style="font-size:.8125rem;color:var(--color-text-muted)">'+it.time+' · '+formatDose(dose)+' '+esc(it.med.unit)+'</span></div>'+
          '<label class="toggle-wrap"><span class="toggle"><input type="checkbox" data-toggle-key="'+key+'" data-med="'+it.med.id+'" data-time="'+it.time+'" data-dose="'+dose+'"'+(done?' checked':'')+(readonly?' disabled':'')+'><span class="toggle-slider"></span></span></label></div>';
      }).join('');
    }else{
      inner='<p style="color:var(--color-text-muted);font-size:.875rem;padding:.5rem 0">此時段暫無服藥安排</p>';
    }
    const btnDisabled=readonly||!list.length||allDone;
    slotsHtml+='<div class="slot-group" data-slot="'+slot+'"><div class="slot-title">'+SLOT_LABELS[slot]+'（'+slotTimeRange(slot)+'）</div>'+
      (list.length?'<button type="button" class="btn btn-success btn-block slot-complete" data-slot-complete="'+slot+'"'+(btnDisabled?' disabled':'')+'>✅ 一鍵完成整個時段</button>':'')+
      inner+'</div>';
  });

  if(!items.length){
    slotsHtml='<div class="empty"><span class="emoji">🐾</span>尚未設定服藥日程，請先到庫存新增藥物，再為每隻藥設定服藥時間</div>';
  }

  const unlockBtn=readonly?'<button type="button" class="btn btn-sm btn-secondary" id="btn-unlock">🔓 解鎖補錄</button>':'';
  const readonlyTag=readonly?'<span class="readonly-badge">唯讀模式</span>':'';

  const dailyHtml=renderDailyNotesSection(date,readonly);
  const mealsHtml=renderMealsSection(date,readonly);
  el.innerHTML=viewHeaderHtml('每日服藥日程','按時段管理 Tricky 的服藥記錄')+
    '<div class="card"><div class="date-nav">'+
    '<button type="button" class="btn btn-sm btn-ghost" id="date-prev" aria-label="上一天">◀</button>'+
    '<input type="date" id="schedule-date" value="'+date+'" max="'+todayStr()+'">'+
    '<button type="button" class="btn btn-sm btn-ghost" id="date-next" aria-label="下一天">▶</button>'+
    readonlyTag+unlockBtn+'</div>'+undoBar+slotsHtml+dailyHtml+'</div>'+
    '<div class="card">'+mealsHtml+'</div>'+
    '<div class="card" style="margin-top:1rem"><h2 style="font-size:1rem;margin-bottom:.75rem">設定服藥時間</h2><div id="schedule-config"></div></div>';

  document.getElementById('schedule-date').onchange=e=>{scheduleDate=e.target.value;renderSchedule();};
  document.getElementById('date-prev').onclick=()=>{scheduleDate=addDays(scheduleDate,-1);renderSchedule();};
  document.getElementById('date-next').onclick=()=>{
    if(scheduleDate<todayStr()){scheduleDate=addDays(scheduleDate,1);renderSchedule();}
  };
  const unlock=document.getElementById('btn-unlock');
  if(unlock)unlock.onclick=()=>{scheduleUnlocked[date]=true;renderSchedule();showToast('已解鎖，可補錄記錄');};
  const undoBtn=document.getElementById('btn-undo');
  if(undoBtn)undoBtn.onclick=performUndo;

  el.querySelectorAll('[data-slot-complete]').forEach(b=>b.onclick=()=>confirmSlotComplete(date,b.dataset.slotComplete));
  el.querySelectorAll('[data-toggle-key]').forEach(inp=>inp.onchange=()=>toggleSingle(date,inp));

  renderScheduleConfig();
  bindDailyNotesEvents(date,readonly);
  bindMealsEvents(date,readonly);
}

function getWalkTotalMinutes(date){
  return getWalkTotalMinutesFromWalks(readDailyNoteDay(date).walks);
}
function renderWalkListHtml(date,readonly){
  const walks=readDailyNoteDay(date).walks.map(normalizeWalk);
  if(!walks.length)return'';
  return'<ul class="walk-list">'+walks.map((w,i)=>{
    const noteHtml=w.note?'<br><span style="color:var(--color-text-muted)">'+esc(w.note)+'</span>':'';
    const delBtn=readonly?'':'<button type="button" class="btn-walk-del" data-del-walk="'+date+'" data-walk-idx="'+i+'" aria-label="刪除散步紀錄">🗑️</button>';
    return'<li class="walk-row"><div class="walk-row-info"><strong>'+w.startTime+' · '+w.durationMinutes+' 分鐘</strong>'+noteHtml+'</div>'+delBtn+'</li>';
  }).join('')+'</ul>';
}
function renderPoopListHtml(date,readonly){
  const poops=readDailyNoteDay(date).poops;
  if(!poops.length)return'';
  return'<ul class="poop-list">'+poops.map((p,i)=>{
    const n=normalizePoop(p);
    const delBtn=readonly?'':'<button type="button" class="btn-walk-del" data-del-poop="'+date+'" data-poop-idx="'+i+'" aria-label="刪除排便紀錄">🗑️</button>';
    let detail;
    if(n.hasPoop){
      const soft=POOP_SOFTNESS_LABELS[n.softness]||n.softness;
      detail='有大便 · '+n.count+' 次 · '+esc(soft);
    }else detail='無大便';
    const timeHtml=n.time?'<br><span style="color:var(--color-text-muted)">記錄時間 '+esc(n.time)+'</span>':'';
    return'<li class="poop-row"><div class="poop-row-info"><strong>'+esc(date)+'</strong>'+timeHtml+'<br>'+detail+'</div>'+delBtn+'</li>';
  }).join('')+'</ul>';
}
function renderDailyNotesSection(date,readonly){
  const totalWalk=getWalkTotalMinutes(date);
  const isToday=date===todayStr();
  const running=walkTimerStart&&scheduleDate===todayStr()&&isToday;
  let elapsed='0:00';
  if(running){
    const sec=Math.floor((Date.now()-walkTimerStart)/1000);
    elapsed=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  }
  const walkList=renderWalkListHtml(date,readonly);
  const poopList=renderPoopListHtml(date,readonly);
  const manualBtn=readonly?'':'<button type="button" class="btn btn-secondary btn-block" style="margin-top:.75rem" id="walk-manual">✏️ 手動補錄散步</button>';
  const timerBtn=readonly?'':'<button type="button" class="btn btn-primary btn-block" id="walk-toggle">'+(running?'⏹ 停止計時':'▶ 開始計時')+'</button>';
  const addPoopBtn=readonly?'':'<button type="button" class="btn btn-secondary btn-block" style="margin-top:.75rem" id="poop-add">➕ 新增排便記錄</button>';
  return'<div class="daily-section"><h3>🐾 日常生活紀錄</h3>'+
    '<p style="font-size:.875rem;margin-bottom:.5rem">今日總散步時長：<strong>'+totalWalk+'</strong> 分鐘</p>'+
    (readonly?'<p class="form-hint">唯讀模式</p>':'')+
    '<div class="walk-timer-display" id="walk-display">'+(running?elapsed:'—')+'</div>'+
    timerBtn+manualBtn+walkList+
    '<p style="margin-top:1rem;font-size:.875rem;font-weight:500">排便記錄</p>'+
    addPoopBtn+poopList+
    '</div>';
}
function renderMealsSection(date,readonly){

function openPoopModal(opts){

  const countVal=opts.count!=null?opts.count:1;
  const softnessVal=opts.softness!=null?opts.softness:3;
  const softnessOpts=Object.keys(POOP_SOFTNESS_LABELS).map(k=>'<option value="'+k+'"'+(String(softnessVal)===k?' selected':'')+'>'+esc(POOP_SOFTNESS_LABELS[k])+'</option>').join('');
  openModal('新增排便記錄',
    '<form id="poop-form">'+
    '<div class="form-group"><label>日期 *</label><input type="date" name="poopDate" required max="'+todayStr()+'" value="'+dateVal+'"></div>'+
    '<div class="form-group"><label>有無大便 *</label>'+
    '<div class="poop-btns" id="poop-has-btns">'+
    '<button type="button" class="poop-btn'+(hasPoop?' active':'')+'" data-poop-has="yes">有</button>'+
    '<button type="button" class="poop-btn'+(!hasPoop?' active':'')+'" data-poop-has="no">無</button>'+
    '</div><input type="hidden" name="hasPoop" id="poop-has-input" value="'+(hasPoop?'yes':'no')+'"></div>'+
    '<div class="poop-detail-fields'+(hasPoop?'':' hidden')+'" id="poop-detail-fields">'+
    '<div class="form-group"><label>次數 *</label><input type="number" name="count" id="poop-count" min="1" step="1" value="'+countVal+'" inputmode="numeric"></div>'+
    '<div class="form-group"><label>軟硬度 *</label><select name="softness" id="poop-softness">'+softnessOpts+'</select></div>'+
    '</div></form>',
    '<button type="button" class="btn btn-cancel" data-modal-cancel>取消</button><button type="button" class="btn btn-confirm" data-modal-save>儲存</button>');
  const form=document.getElementById('poop-form');
  const hasInput=document.getElementById('poop-has-input');
  const detailFields=document.getElementById('poop-detail-fields');
  const countInp=document.getElementById('poop-count');
  const softInp=document.getElementById('poop-softness');
  function setHasPoop(yes){
    hasInput.value=yes?'yes':'no';

      b.classList.toggle('active',b.dataset.poopHas===(yes?'yes':'no'));

    if(yes){
      if(!countInp.value||parseInt(countInp.value,10)<1)countInp.value='1';
      countInp.required=true;
      softInp.required=true;

      countInp.value='';
      softInp.value='3';
      countInp.required=false;
      softInp.required=false;
    }

function openWalkModal(opts){
  opts=opts||{};
  const dateVal=opts.date||scheduleDate;
  const totalMin=opts.minutes!=null?Math.max(0,Math.round(Number(opts.minutes))):0;
  const hours=Math.floor(totalMin/60);
  const mins=totalMin%60;
  const startTime=opts.startTime||nowTimeStr();
  const noteVal=opts.note||'';
  const isEdit=opts.editDate!=null&&opts.editIdx!=null;
  openModal(isEdit?'編輯散步紀錄':'手動補錄散步',
    '<form id="walk-form">'+
    '<div class="form-group"><label>日期 *</label><input type="date" name="walkDate" required max="'+todayStr()+'" value="'+dateVal+'"></div>'+
    '<div class="form-group"><label>開始時間 *</label><input type="time" name="walkStart" required value="'+startTime+'"></div>'+
    '<div class="form-row"><div class="form-group"><label>小時</label><input type="number" id="walk-hours" min="0" max="23" step="1" value="'+hours+'"></div>'+
    '<div class="form-group"><label>分鐘 *</label><input type="number" id="walk-mins" min="1" max="599" step="1" value="'+(totalMin>0?totalMin:mins||'')+'" required></div></div>'+
    '<div class="duration-quick">'+WALK_QUICK_MINS.map(m=>'<button type="button" class="walk-min-pick" data-min="'+m+'">'+m+'</button>').join('')+'</div>'+
    '<div class="form-group" style="margin-top:1rem"><label>備註</label><textarea name="walkNote">'+esc(noteVal)+'</textarea></div></form>',
    '<button type="button" class="btn btn-cancel" data-modal-cancel>取消</button><button type="button" class="btn btn-confirm" data-modal-save>儲存</button>');
  const form=document.getElementById('walk-form');
  const hInp=document.getElementById('walk-hours');
  const mInp=document.getElementById('walk-mins');
  function syncFromParts(){
    const h=parseInt(hInp.value,10)||0;
    const m=parseInt(mInp.value,10)||0;
    return h*60+m;
  }
  function setTotalMinutes(total){
    const t=Math.max(0,Math.round(total));
    hInp.value=Math.floor(t/60);
    mInp.value=t%60||t;
  }
  document.querySelectorAll('.walk-min-pick').forEach(btn=>{
    btn.onclick=()=>{hInp.value=0;mInp.value=btn.dataset.min;};
  });
  document.querySelector('[data-modal-cancel]').onclick=closeModal;
  document.querySelector('[data-modal-save]').onclick=()=>{
    if(!form.reportValidity())return;
    const fd=new FormData(form);
    const saveDate=fd.get('walkDate');
    const durationMinutes=syncFromParts();
    if(durationMinutes<1){showToast('請輸入有效時長');return;}
    const entry={id:isEdit?normalizeWalk(readDailyNoteDay(opts.editDate).walks[opts.editIdx]).id:Date.now(),
      startTime:fd.get('walkStart'),durationMinutes,note:fd.get('walkNote').trim()};
    const{all,day}=mutateDailyDay(saveDate);
    day.walks=day.walks||[];
    if(isEdit&&opts.editDate===saveDate){
      day.walks[opts.editIdx]=entry;
    }else if(isEdit){
      const src=mutateDailyDay(opts.editDate);
      src.day.walks.splice(opts.editIdx,1);
      src.all[opts.editDate]=src.day;
      day.walks.push(entry);
      all[saveDate]=day;
      saveDailyNotes(src.all);
    }else{
      day.walks.push(entry);
    }
    all[saveDate]=day;
    saveDailyNotes(all);
    closeModal();
    renderSchedule();
    if(currentView==='health'&&healthTab==='exercise')renderHealth();
    if(currentView==='dashboard')renderDashboard();
    showToast('散步紀錄已儲存');
  };
}

}

function completeSlot(date,slot){
  const comp=getCompletionsForDate(date);
  const list=getAllScheduleItems().filter(it=>it.slot===slot);
  const snapshot={date,slot,items:[],doseLogIds:[]};
  const session=SLOT_LABELS[slot];
  list.forEach(it=>{
    const key=completionKey(it.med.id,it.time);
    if(comp.items[key])return;
    const dose=parseDoseValue(it.dose)||parseDoseValue(it.med.dosePerTime);
    comp.items[key]=true;
    const batchDeductions=deductMedStock(it.med,dose);
    const logId=addDoseLog(it.med.id,it.med.name,dose,date,session,batchDeductions);
    snapshot.items.push({key,medId:it.med.id,dose,batchDeductions});
    snapshot.doseLogIds.push(logId);
  });
  saveState();
  pendingUndo=snapshot;
  if(undoTimer)clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{pendingUndo=null;renderSchedule();},30000);
  renderSchedule();
  showToast(SLOT_LABELS[slot]+' 已完成');
}

function performUndo(){
  if(!pendingUndo)return;
  const comp=getCompletionsForDate(pendingUndo.date);
  pendingUndo.items.forEach(({key,medId,dose,batchDeductions})=>{
    delete comp.items[key];
    const med=state.medications.find(m=>m.id===medId);
    if(med){
      if(batchDeductions&&batchDeductions.length)restoreMedStockByBatches(med,batchDeductions);
      else restoreMedStock(med,dose);
    }
  });
  removeDoseLogsByIds(pendingUndo.doseLogIds||[]);
  saveState();
  pendingUndo=null;
  if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}
  renderSchedule();
  showToast('已撤銷');
}

function toggleSingle(date,inp){
  if(isReadonlyScheduleDate(date)){inp.checked=!inp.checked;return;}
  const comp=getCompletionsForDate(date);
  const key=inp.dataset.toggleKey;
  const medId=inp.dataset.med;
  const dose=parseDoseValue(inp.dataset.dose);
  const schedTime=inp.dataset.time;
  const med=state.medications.find(m=>m.id===medId);
  if(!med){inp.checked=false;return;}
  ensureMedBatches(med);
  if(inp.checked){
    if(med.stock<dose){showToast('庫存不足');inp.checked=false;return;}
    comp.items[key]=true;
    const batchDeductions=deductMedStock(med,dose);
    const session=SLOT_LABELS[getSlot(schedTime)]||'其他';
    addDoseLog(medId,med.name,dose,date,session,batchDeductions);
    showToast('已標記完成');
  }else{
    delete comp.items[key];
    const log=removeLatestDoseLog(medId,date);
    if(log&&log.batchDeductions&&log.batchDeductions.length)restoreMedStockByBatches(med,log.batchDeductions);
    else restoreMedStock(med,dose);
    showToast('已取消標記');
  }
  saveState();
  if(currentView==='dashboard')renderDashboard();
}

function drawWeightChart(logs){
  const canvas=document.getElementById('weight-canvas');
  if(!canvas)return;
  const wrap=canvas.parentElement;
  const w=wrap.offsetWidth||300;
  const h=200;
  canvas.width=w;
  canvas.height=h;
  const ctx=canvas.getContext('2d');
  const pad={t:24,r:16,b:36,l:44};
  const cw=w-pad.l-pad.r;
  const ch=h-pad.t-pad.b;
  const vals=logs.map(l=>l.kg);
  const min=Math.min(...vals);
  const max=Math.max(...vals);
  const range=max-min||1;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--color-surface').trim()||'#f9f8f5';
  const primary=getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim()||'#01696f';
  const muted=getComputedStyle(document.documentElement).getPropertyValue('--color-text-muted').trim()||'#7a7974';
  const err=getComputedStyle(document.documentElement).getPropertyValue('--color-error').trim()||'#a12c7b';
  const success=getComputedStyle(document.documentElement).getPropertyValue('--color-success').trim()||'#437a22';
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=muted;
  ctx.lineWidth=1;
  ctx.globalAlpha=.3;
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*i/4;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
  }
  ctx.globalAlpha=1;
  const pts=logs.map((l,i)=>{
    const x=pad.l+(logs.length===1?cw/2:cw*i/(logs.length-1));
    const y=pad.t+ch-(l.kg-min)/range*ch;
    return{x,y,kg:l.kg,date:l.date};
  });
  ctx.strokeStyle=primary;
  ctx.lineWidth=2;
  ctx.beginPath();
  pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
  ctx.stroke();
  let minIdx=0,maxIdx=0;
  vals.forEach((v,i)=>{if(v<=vals[minIdx])minIdx=i;if(v>=vals[maxIdx])maxIdx=i;});
  pts.forEach((p,i)=>{
    ctx.fillStyle=primary;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
    if(i===minIdx||i===maxIdx){
      ctx.fillStyle=i===maxIdx?err:success;
      ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-text').trim();
      ctx.font='11px Noto Sans TC,sans-serif';
      ctx.textAlign='center';
      const label=(i===maxIdx?'最高 ':'最低 ')+p.kg+'kg';
      ctx.fillText(label,p.x,p.y-12);
    }
  });
  ctx.fillStyle=muted;
  ctx.font='10px Noto Sans TC,sans-serif';
  ctx.textAlign='center';
  const step=Math.max(1,Math.floor(logs.length/5));
  pts.forEach((p,i)=>{
    if(i%step===0||i===pts.length-1){
      const short=p.date.slice(5);
      ctx.fillText(short,p.x,h-8);
    }
  });
}

function openWeightForm(id){
  const w=id?state.weightLogs.find(x=>x.id===id):null;
  const ownerW=getOwnerWeight();
  openModal(id?'編輯體重':'新增體重',
    '<form id="weight-form"><div class="form-group"><label>日期 *</label><input type="date" name="date" required max="'+todayStr()+'" value="'+(w?w.date:todayStr())+'"></div>'+
    '<label class="toggle-wrap" style="margin-bottom:1rem"><span>輔助計算模式</span><span class="toggle"><input type="checkbox" id="weight-calc-toggle"><span class="toggle-slider"></span></span></label>'+
    '<div id="weight-calc-panel" class="weight-calc-panel" style="display:none">'+
    '<div class="form-group"><label>抱起後總重量 (kg)</label><input type="number" id="w-total" min="0" step="0.01" placeholder="0.00"></div>'+
    '<div class="form-group"><label>主人自身重量 (kg)</label><input type="number" id="w-owner" min="0" step="0.01" placeholder="0.00"></div>'+
    '<p class="weight-calc-result" id="w-calc-result">Tricky 體重 = — kg</p></div>'+
    '<div class="form-group"><label>Tricky 體重 (kg) *</label><input type="number" name="kg" required min="0.1" step="0.01" value="'+(w?w.kg:'')+'"></div></form>',
    '<button type="button" class="btn btn-cancel" data-modal-cancel>取消</button><button type="button" class="btn btn-confirm" data-modal-save>儲存</button>');
  const form=document.getElementById('weight-form');
  const kgInp=form.querySelector('[name=kg]');
  const calcToggle=document.getElementById('weight-calc-toggle');
  const calcPanel=document.getElementById('weight-calc-panel');
  const wTotal=document.getElementById('w-total');
  const wOwner=document.getElementById('w-owner');
  const wResult=document.getElementById('w-calc-result');
  let kgManualOverride=false;
  kgInp.addEventListener('input',()=>{kgManualOverride=true;});
  function persistOwnerWeight(){
    const owner=parseFloat(wOwner.value);
    if(!isNaN(owner)&&owner>0)setOwnerWeight(owner);
  }
  function updateCalc(){
    const total=parseFloat(wTotal.value);
    const owner=parseFloat(wOwner.value);
    if(!isNaN(total)&&!isNaN(owner)&&total>owner){
      const tricky=total-owner;
      const trickyDisplay=Math.round(tricky*100)/100;
      wResult.textContent='Tricky 體重 = '+trickyDisplay+' kg';
      if(calcToggle.checked&&!kgManualOverride)kgInp.value=trickyDisplay;
    }else wResult.textContent='Tricky 體重 = — kg';
  }
  function showCalcPanel(show){
    calcPanel.style.display=show?'block':'none';
    if(show){
      if(ownerW&&!wOwner.value)wOwner.value=ownerW;
      kgManualOverride=false;
      updateCalc();
    }
  }
  calcToggle.onchange=()=>showCalcPanel(calcToggle.checked);
  wTotal.oninput=()=>{kgManualOverride=false;updateCalc();};
  wOwner.oninput=()=>{persistOwnerWeight();kgManualOverride=false;updateCalc();};
  document.querySelector('[data-modal-cancel]').onclick=closeModal;
  document.querySelector('[data-modal-save]').onclick=()=>{
    if(!form.reportValidity())return;
    const fd=new FormData(form);
    const data={date:fd.get('date'),kg:parseFloat(fd.get('kg'))};
    if(isNaN(data.kg)||data.kg<=0){showToast('請輸入有效體重');return;}
    persistOwnerWeight();
    if(id){const i=state.weightLogs.findIndex(x=>x.id===id);if(i>=0)state.weightLogs[i]={...state.weightLogs[i],...data};}
    else state.weightLogs.push({id:uid(),...data});
    saveState();closeModal();renderHealth();showToast('已儲存');
  };
  icons();
}

  confirmDialog('刪除記錄','確定刪除此體重記錄？',()=>{
    state.weightLogs=state.weightLogs.filter(x=>x.id!==id);
    saveState();renderHealth();showToast('已刪除');
  });
}

function csvEscape(v){
  const s=String(v==null?'':v);
  if(/[",\n\r]/.test(s))return'"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadBlob(filename,content,type){
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportCsvStock(){
  const BOM='\uFEFF';
  const header=['名稱','類型','庫存數量','單位','每次劑量','低庫存閾值','批次詳情（到期日:數量）'];
  const rows=state.medications.map(m=>{
    ensureMedBatches(m);
    const batchDetail=m.batches.map(b=>{
      const exp=b.expiry||'未設定';
      return exp+':'+formatDose(b.qty);
    }).join('/');
    return[m.name,m.type==='drug'?'藥物':'保健品',m.stock,m.unit,m.dosePerTime,m.lowStockThreshold,batchDetail];
  });
  const csv=BOM+header.join(',')+'\n'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadBlob('tricky-stock-'+todayStr()+'.csv',csv,'text/csv;charset=utf-8');
  showToast('已匯出庫存 CSV');
}
function exportCsvHistory(){
  const BOM='\uFEFF';
  const lines=[['類別','日期','藥物/項目','時間','劑量','單位/時段','狀態','備註','散步總時長(分鐘)','排便狀況','第1餐份量','第2餐份量','第3餐份量','第4餐份量'].map(csvEscape).join(',')];
  const dailyMap=getDailyNotes();
  function extraCols(date){
    const day=dailyMap[date]||{};
    const walkTotal=(day.walks||[]).reduce((s,w)=>s+(Number(w.durationMinutes)||0),0);
    const poopText=(day.poops||[]).map(p=>formatPoopExportText(p)).filter(Boolean).join(' / ');
    const meals=Array.isArray(day.meals)?day.meals:[];
    const m1=meals[0]&&meals[0].note?meals[0].note:'';
    const m2=meals[1]&&meals[1].note?meals[1].note:'';
    const m3=meals[2]&&meals[2].note?meals[2].note:'';
    const m4=meals[3]&&meals[3].note?meals[3].note:'';
    return[walkTotal||'',poopText,m1,m2,m3,m4];
  }
  getDoseLogs().slice().reverse().forEach(l=>{
    const med=state.medications.find(m=>m.id===l.medicineId);
    lines.push(['扣數',l.date,l.medicineName,l.time,l.qty,med?med.unit:l.session,'已服藥','',...extraCols(l.date)].map(csvEscape).join(','));
  });
  Object.keys(state.completions).sort().forEach(date=>{
    const comp=state.completions[date];
    Object.keys(comp.items||{}).forEach(key=>{
      if(!comp.items[key])return;
      const us=key.lastIndexOf('_');
      const medId=key.slice(0,us);
      const time=key.slice(us+1);
      const med=state.medications.find(m=>m.id===medId);
      const sched=(state.schedules[medId]||[]).find(s=>s.time===time);
      const dose=sched?sched.dose:(med?med.dosePerTime:'');
      lines.push(['服藥記錄',date,med?med.name:'',time,dose,med?med.unit:'','已完成','',...extraCols(date)].map(csvEscape).join(','));
    });
  });
  Object.keys(dailyMap).sort().forEach(date=>{
    const d=dailyMap[date];
    const walkMin=(d.walks||[]).reduce((s,w)=>s+(w.durationMinutes||0),0);
    if(walkMin>0)lines.push(['散步',date,'總時長','',walkMin+'分鐘','','','',...extraCols(date)].map(csvEscape).join(','));
    (d.poops||[]).forEach(p=>{
      const n=normalizePoop(p);
      lines.push(['排便',date,formatPoopExportText(p),n.time||'',n.hasPoop?n.count:'',n.hasPoop?(POOP_SOFTNESS_LABELS[n.softness]||n.softness):'','','',...extraCols(date)].map(csvEscape).join(','));
    });
  });
  state.abnormalLogs.forEach(a=>{
    lines.push(['異常',a.date,a.type,'','','','',a.description||'',...extraCols(a.date)].map(csvEscape).join(','));
  });
  state.weightLogs.forEach(w=>{
    lines.push(['體重',w.date,w.kg+'kg','','','','','',...extraCols(w.date)].map(csvEscape).join(','));
  });
  downloadBlob('tricky-history-'+todayStr()+'.csv',BOM+lines.join('\n'),'text/csv;charset=utf-8');
  showToast('已匯出歷史 CSV');
}

function importJson(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      confirmDialog('還原資料','此操作將覆蓋現有資料，確定要繼續？',()=>{
        restoreFullBackup(data);
        saveState();
        initExtraKeys();
        scheduleUnlocked={};
        pendingUndo=null;
        expandedMedLogs={};
        applyTheme();
        render();
        showToast('資料已還原');
      });
    }catch(e){showToast('JSON 格式無效');}
  };
  reader.readAsText(file);
}

    '<button type="button" class="btn btn-primary btn-block" id="exp-json">匯出 JSON 備份</button>'+

    '匯入 JSON 還原<input type="file" class="hidden-input" id="imp-json" accept=".json,application/json"></label></div></div>';
  document.getElementById('exp-csv-stock').onclick=exportCsvStock;
  document.getElementById('exp-csv-hist').onclick=exportCsvHistory;

    if(f)importJson(f);
    e.target.value='';
  };
  document.getElementById('theme-toggle-mobile').onclick=cycleTheme;
  applyTheme();
